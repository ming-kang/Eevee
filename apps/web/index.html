<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eevee</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202020'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' font-family='sans-serif' fill='%23f5f5f4'%3EE%3C/text%3E%3C/svg%3E"
    />
    <script>
      (function () {
        var pref = "system";
        var preset = "paper";
        try {
          var saved = localStorage.getItem("eevee-theme");
          if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
          var savedPreset = localStorage.getItem("eevee-theme-preset");
          if (
            savedPreset === "paper" ||
            savedPreset === "pi" ||
            savedPreset === "graphite" ||
            savedPreset === "lagoon"
          ) {
            preset = savedPreset;
          }
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var scheme = dark ? "dark" : "light";
        document.documentElement.dataset.colorScheme = scheme;
        document.documentElement.dataset.theme = scheme;
        document.documentElement.dataset.themePreset = preset;
        try {
          var uiRaw = localStorage.getItem("eevee-ui-size");
          if (uiRaw && /^\d+$/.test(uiRaw)) {
            var ui = Number(uiRaw);
            if (ui >= 12 && ui <= 22) document.documentElement.style.setProperty("--ev-ui-size", ui + "px");
          }
          var codeRaw = localStorage.getItem("eevee-code-size");
          if (codeRaw && /^\d+$/.test(codeRaw)) {
            var code = Number(codeRaw);
            if (code >= 10 && code <= 22) document.documentElement.style.setProperty("--ev-code-size", code + "px");
          }
          var widthRaw = localStorage.getItem("eevee-chat-width");
          document.documentElement.dataset.chatWidth = widthRaw === "wide" ? "wide" : "standard";
          var fontRaw = localStorage.getItem("eevee-prose-font");
          document.documentElement.dataset.proseFont =
            fontRaw === "sans" || fontRaw === "mono" || fontRaw === "wenkai" ? fontRaw : "wenkai";
          var savedLocale = localStorage.getItem("eevee-locale");
          var locale =
            savedLocale === "zh-CN" || savedLocale === "en"
              ? savedLocale
              : (navigator.language || "zh-CN").toLowerCase().indexOf("zh") === 0
                ? "zh-CN"
                : "en";
          document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
