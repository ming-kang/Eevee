<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eevee</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='7' fill='%231c1c1c'/%3E%3Ccircle cx='12' cy='12' r='3.1' fill='%23fff'/%3E%3Ccircle cx='18.06' cy='8.5' r='1.7' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Paint the first frame in the right palette and size; `theme.ts` and `text-size.ts` take over
      // once the app runs.
      try {
        var pref = localStorage.getItem("eevee.theme");
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var size = Number(localStorage.getItem("eevee.textSize"));
        if ([13, 14, 15, 16].indexOf(size) >= 0) document.documentElement.style.setProperty("--ev-ui", size + "px");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
